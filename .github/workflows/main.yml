name: Build & Sign Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Keystore from Secret
        run: |
          echo "${{ secrets.MIKDAD_KEYSTORE }}" | base64 -d > mikdadstream.keystore
          echo "Keystore decoded: $(ls -la mikdadstream.keystore)"

      - name: Build Release APK
        run: >
          ./gradlew assembleRelease
          -PVERSION_CODE=${{ github.run_number }}
          -PVERSION_NAME=2.1.${{ github.run_number }}
          -PSTREAM_STORE_PASSWORD=${{ secrets.STREAM_STORE_PASSWORD }}
          -PSTREAM_KEY_PASSWORD=${{ secrets.STREAM_KEY_PASSWORD }}
          -PSTREAM_KEY_ALIAS=${{ secrets.STREAM_KEY_ALIAS }}
        env:
          STREAM_STORE_PASSWORD: ${{ secrets.STREAM_STORE_PASSWORD }}
          STREAM_KEY_PASSWORD: ${{ secrets.STREAM_KEY_PASSWORD }}
          STREAM_KEY_ALIAS: ${{ secrets.STREAM_KEY_ALIAS }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: Release v2.1.${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          make_latest: true
